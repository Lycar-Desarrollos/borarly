[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # La Firebase API Key (AIza...) es PUBLICA por diseño en Next.js con NEXT_PUBLIC_.
  # Se embebe en el bundle del cliente intencionalmente. Desactivamos la deteccion
  # inteligente para evitar falsos positivos en el build de Netlify.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cabeceras de seguridad para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Las respuestas de la API nunca deben quedar cacheadas en CDN ni en el navegador.
[[headers]]
  for = "/api/orders/*"
  [headers.values]
    Cache-Control = "no-store"
